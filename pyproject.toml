
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-intelligence"
version = "0.1.0"
description = "An evaluation-driven research intelligence platform powered by RAG."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]

ingestion = [
    "arxiv>=2.1",
    "PyMuPDF>=1.24",
]

retrieval = [
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
]

llm = [
    "ollama>=0.3",
    "google-genai>=1.0",
]

api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

ui = [
    "streamlit>=1.36",
]

evaluation = [
    "ragas>=0.2",
    "mlflow>=2.14",
]

observability = [
    "langfuse>=2.0",
]

dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_paper_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


